services:
  - type: web
    name: fashion-detector
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PORT
        value: 10000
      - key: MODEL_URL
        sync: false
    disk:
      name: model-storage
      mountPath: /opt/render/project/src/weights
      sizeGB: 1
